<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="登录创剧，继续完成你的 AI 视频作品。" />
    <meta name="theme-color" content="#09111F" />
    <link rel="icon" href="/favicon.svg?v=20260824-chuangju-v1" type="image/svg+xml" />
    <link rel="icon" href="/favicon.ico?v=20260824-chuangju-v1" sizes="any" />
    <link rel="icon" href="/favicon-32x32.png?v=20260824-chuangju-v1" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=20260824-chuangju-v1" />
    <title>创剧 · 登录</title>
    <style>
        :root {
            --n0: #FFFFFF;
            --n10: #FBFBF9;
            --n20: #F4F4F1;
            --n30: #F0F0EC;
            --n40: #E5E5E0;
            --n100: #9A9AA2;
            --n200: #8A8A94;
            --n300: #6A6A74;
            --n700: #22222B;
            --n800: #17171C;
            --primary: #5B49F0;
            --primary-hover: #4C3BD6;
            --primary-active: #4536C9;
            --primary-light: #ECE9FF;
            --purple: #8B6BFF;
            --pink: #FF9A6B;
            --green: #12B76A;
            --danger: #E5533C;
            --border-hover: #9A9AA2;
            --shadow-cascade: 0 24px 70px rgba(20, 20, 25, 0.18);
            --shadow-glow: 0 4px 14px rgba(91, 73, 240, 0.35);
            --font-sans: "Noto Sans SC", "Sora", "PingFang SC", "Microsoft YaHei", sans-serif;
        }

        * { box-sizing: border-box; }

        html,
        body {
            margin: 0;
            min-height: 100%;
            overflow-x: hidden;
            font-family: var(--font-sans);
            background: var(--n0);
            color: var(--n800);
            -webkit-font-smoothing: antialiased;
        }

        body {
            min-height: 100vh;
            display: flex;
        }

        .shell {
            min-height: 100vh;
            width: 100%;
            display: flex;
        }

        .brand-panel {
            position: relative;
            display: grid;
            width: 44%;
            min-width: 520px;
            height: 100vh;
            grid-template-rows: auto minmax(0, 1fr) auto auto;
            gap: 28px;
            padding: 38px 56px 30px;
            background:
                radial-gradient(circle at 18% 16%, rgba(42, 103, 246, 0.18), transparent 30%),
                radial-gradient(circle at 82% 62%, rgba(91, 73, 240, 0.18), transparent 38%),
                linear-gradient(145deg, #0C1628 0%, #09111F 54%, #070D18 100%);
            color: white;
            overflow-x: hidden;
            overflow-y: auto;
        }

        .brand-panel::before {
            content: "";
            position: absolute;
            inset: 0;
            background:
                linear-gradient(rgba(255,255,255,0.045) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.045) 1px, transparent 1px);
            background-size: 40px 40px;
            mask-image: linear-gradient(to bottom, rgba(0,0,0,0.82), transparent 94%);
            pointer-events: none;
        }

        .brand-panel::after {
            content: "";
            position: absolute;
            width: 520px;
            height: 520px;
            right: -330px;
            top: 80px;
            border: 1px solid rgba(115, 151, 214, 0.14);
            border-radius: 50%;
            box-shadow: 0 0 0 92px rgba(61, 94, 157, 0.035);
            pointer-events: none;
        }

        .brand-top,
        .brand-content,
        .workflow-showcase,
        .brand-footer {
            position: relative;
            z-index: 1;
        }

        .brand-top,
        .mobile-brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand-lockup {
            width: min(156px, 40vw);
            height: auto;
            display: block;
            object-fit: contain;
        }

        .mobile-brand .brand-lockup {
            width: min(168px, 62vw);
        }

        .brand-content {
            align-self: center;
            max-width: 590px;
            padding-top: 8px;
        }

        .brand-content h1 {
            max-width: 560px;
            margin: 0;
            font-size: clamp(36px, 3.15vw, 58px);
            line-height: 1.06;
            font-weight: 800;
            letter-spacing: -1.2px;
        }

        .brand-content p {
            max-width: 560px;
            margin: 20px 0 0;
            color: rgba(230, 237, 250, 0.68);
            font-size: 14px;
            line-height: 1.85;
        }

        .workflow-showcase {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 12px;
            align-self: end;
        }

        .workflow-card {
            min-width: 0;
        }

        .workflow-preview {
            position: relative;
            height: 116px;
            overflow: hidden;
            border: 1px solid rgba(139, 169, 223, 0.24);
            border-top: 2px solid var(--accent, #4D8DFF);
            border-radius: 10px;
            background: #111D31;
            box-shadow: 0 14px 34px rgba(0, 0, 0, 0.22);
        }

        .workflow-preview::before {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(255,255,255,0.055), transparent 48%);
            pointer-events: none;
        }

        .workflow-window-bar {
            height: 20px;
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 0 8px;
            background: #1A2941;
        }

        .workflow-window-bar i {
            width: 3px;
            height: 3px;
            border-radius: 50%;
            background: #7183A0;
        }

        .story-ui {
            display: grid;
            grid-template-columns: 30% 1fr;
            gap: 7px;
            height: calc(100% - 20px);
            padding: 9px;
        }

        .story-sidebar,
        .story-paper,
        .shot-card,
        .final-frame {
            border: 1px solid rgba(130, 154, 197, 0.22);
            border-radius: 5px;
        }

        .story-sidebar {
            background: #17243A;
        }

        .story-sidebar::before,
        .story-sidebar::after {
            content: "";
            display: block;
            width: 58%;
            height: 4px;
            margin: 11px auto 0;
            border-radius: 4px;
            background: #566B8C;
        }

        .story-sidebar::after {
            width: 42%;
            margin-top: 7px;
            background: #6C5CF6;
        }

        .story-paper {
            padding: 11px 10px;
            background: #E9EEF7;
        }

        .story-line {
            height: 4px;
            margin-bottom: 7px;
            border-radius: 5px;
            background: #A6B4CA;
        }

        .story-line.short { width: 64%; }

        .story-action {
            width: 42%;
            height: 11px;
            margin-top: 11px;
            border-radius: 4px;
            background: #5B49F0;
        }

        .shot-ui {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 6px;
            height: calc(100% - 20px);
            padding: 9px;
        }

        .shot-card {
            overflow: hidden;
            background: #E8EDF6;
        }

        .shot-image {
            height: 54%;
            background:
                radial-gradient(circle at 72% 34%, #8B6BFF 0 9%, transparent 10%),
                linear-gradient(145deg, #29456F 0%, #192B47 54%, #477F9D 55%, #253A57 100%);
        }

        .shot-card:nth-child(2) .shot-image {
            background:
                radial-gradient(circle at 35% 38%, #14B8A6 0 9%, transparent 10%),
                linear-gradient(155deg, #1D3352 0%, #2B5485 52%, #16253B 53%, #263F62 100%);
        }

        .shot-card:nth-child(3) .shot-image {
            background:
                radial-gradient(circle at 62% 36%, #F59E0B 0 9%, transparent 10%),
                linear-gradient(145deg, #223B5C 0%, #15253B 50%, #60446E 51%, #283651 100%);
        }

        .shot-card::after {
            content: "";
            display: block;
            width: 58%;
            height: 4px;
            margin: 10px 7px;
            border-radius: 4px;
            background: #91A1B9;
            box-shadow: 0 8px 0 #C0CAD8;
        }

        .final-ui {
            height: calc(100% - 20px);
            padding: 9px;
        }

        .final-frame {
            position: relative;
            height: 66px;
            background:
                radial-gradient(circle at 50% 45%, rgba(114, 92, 246, 0.9) 0 16%, transparent 17%),
                linear-gradient(135deg, #172A45, #314F76 54%, #111D31);
        }

        .final-play {
            position: absolute;
            left: 50%;
            top: 50%;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: rgba(255,255,255,0.88);
            transform: translate(-50%, -50%);
        }

        .final-play::after {
            content: "";
            position: absolute;
            left: 9px;
            top: 7px;
            border-left: 8px solid #5B49F0;
            border-top: 5px solid transparent;
            border-bottom: 5px solid transparent;
        }

        .final-timeline {
            display: grid;
            grid-template-columns: 34% 42% 1fr;
            gap: 3px;
            margin-top: 6px;
        }

        .final-timeline i {
            height: 7px;
            border-radius: 2px;
            background: #526887;
        }

        .final-timeline i:nth-child(2) { background: #5B49F0; }

        .workflow-copy {
            display: grid;
            grid-template-columns: auto minmax(0, 1fr);
            column-gap: 8px;
            margin-top: 10px;
        }

        .workflow-index {
            color: #58A6FF;
            font-size: 10px;
            font-weight: 800;
            letter-spacing: 0.08em;
        }

        .workflow-title {
            display: block;
            color: rgba(255,255,255,0.92);
            font-size: 12px;
            font-weight: 700;
        }

        .workflow-desc {
            grid-column: 2;
            display: block;
            margin-top: 4px;
            color: rgba(218, 228, 245, 0.52);
            font-size: 10px;
            line-height: 1.45;
        }

        .brand-footer {
            color: rgba(218, 228, 245, 0.5);
            font-size: 11px;
        }

        .login-panel {
            flex: 1;
            min-width: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background: #F6F7FA;
        }

        .login-card {
            width: 100%;
            max-width: 440px;
            background: var(--n0);
            border: 1px solid var(--n40);
            border-radius: 20px;
            padding: 40px 36px;
            box-shadow: 0 14px 44px rgba(20, 20, 25, 0.07);
        }

        .mobile-brand {
            display: none;
            justify-content: center;
            margin-bottom: 32px;
        }

        h2 {
            margin: 0 0 4px;
            font-family: "Sora", var(--font-sans);
            font-size: 32px;
            line-height: 1.3;
            font-weight: 700;
            letter-spacing: -0.4px;
            color: var(--n800);
        }

        .subtitle {
            margin: 0 0 32px;
            color: var(--n300);
            font-size: 16px;
            line-height: 1.6;
        }

        form {
            display: grid;
            gap: 24px;
        }

        .input-group {
            position: relative;
        }

        .input-group input[type="text"],
        .input-group input[type="password"] {
            width: 100%;
            height: 48px;
            border: 1px solid var(--n40);
            border-radius: 9px;
            background: var(--n0);
            color: var(--n800);
            font: inherit;
            font-size: 16px;
            outline: none;
            padding: 10px 12px 8px;
            transition: border-color 150ms ease, box-shadow 150ms ease;
        }

        .input-group input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(91,73,240,0.16);
        }

        .input-group label {
            position: absolute;
            left: 10px;
            top: 15px;
            padding: 0 4px;
            background: transparent;
            color: var(--n200);
            font-size: 15px;
            line-height: 1;
            pointer-events: none;
            transition: transform 150ms ease, color 150ms ease, background-color 150ms ease;
            transform-origin: left center;
        }

        .input-group input:focus + label,
        .input-group input:not(:placeholder-shown) + label,
        .input-group input:-webkit-autofill + label {
            transform: translateY(-22px) scale(0.82);
            background: var(--n0);
            color: var(--primary);
        }

        .input-group input:-webkit-autofill,
        .input-group input:-webkit-autofill:hover,
        .input-group input:-webkit-autofill:focus {
            -webkit-text-fill-color: var(--n800);
            caret-color: var(--n800);
            box-shadow: 0 0 0 1000px var(--n0) inset;
            transition: background-color 9999s ease-out 0s;
        }

        .form-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            color: var(--n300);
            font-size: 12px;
        }

        .remember {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
        }

        .remember:hover,
        .link:hover {
            color: var(--primary);
        }

        .remember input {
            accent-color: var(--primary);
        }

        .link {
            color: inherit;
            text-decoration: none;
            transition: color 150ms ease;
        }

        .login-button {
            width: 100%;
            height: 48px;
            border: 0;
            border-radius: 11px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background: linear-gradient(135deg, #5B49F0, #7A5BFF);
            color: white;
            font: inherit;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: var(--shadow-glow);
            transition: background-color 150ms ease, box-shadow 150ms ease, filter 150ms ease;
        }

        .login-button:hover {
            filter: brightness(1.06);
        }

        .login-button:active {
            filter: brightness(0.96);
        }

        .login-button:disabled {
            cursor: wait;
            opacity: 0.72;
        }

        .icon {
            width: 16px;
            height: 16px;
            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
            fill: none;
        }

        .loader {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            border: 2px solid rgba(255,255,255,0.4);
            border-top-color: white;
            animation: spin 800ms linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .error {
            margin-top: 16px;
            min-height: 18px;
            color: var(--danger);
            text-align: center;
            font-size: 14px;
        }

        .hidden {
            display: none;
        }

        @media (max-width: 992px) {
            .brand-panel {
                display: none;
            }

            .mobile-brand {
                display: flex;
            }

            .login-panel {
                min-height: 100vh;
            }
        }

        @media (min-width: 993px) and (max-width: 1240px) {
            .brand-panel {
                min-width: 460px;
                padding-right: 36px;
                padding-left: 36px;
            }

            .workflow-preview {
                height: 98px;
            }

            .final-frame {
                height: 49px;
            }
        }

        @media (min-width: 993px) and (max-height: 760px) {
            .brand-panel {
                gap: 16px;
                padding-top: 26px;
                padding-bottom: 22px;
            }

            .brand-lockup {
                width: 136px;
            }

            .brand-content h1 {
                font-size: clamp(32px, 2.7vw, 46px);
            }

            .brand-content p {
                margin-top: 12px;
                line-height: 1.65;
            }

            .workflow-preview {
                height: 88px;
            }

            .story-ui,
            .shot-ui,
            .final-ui {
                padding: 7px;
            }

            .story-paper {
                padding: 7px 8px;
            }

            .story-line {
                margin-bottom: 4px;
            }

            .story-action {
                height: 8px;
                margin-top: 5px;
            }

            .final-frame {
                height: 42px;
            }

            .workflow-desc {
                display: none;
            }
        }

        @media (max-width: 479px) {
            .login-panel {
                align-items: flex-start;
                padding: 72px 20px 32px;
            }

            .mobile-brand {
                justify-content: flex-start;
                margin-bottom: 48px;
            }

            h2 {
                font-size: 28px;
            }

            form {
                gap: 20px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                animation-duration: 0.01ms !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>
<body>
    <main class="shell">
        <section class="brand-panel" aria-label="创剧 · AI 视频创作平台">
            <div class="brand-top">
                <img class="brand-lockup" src="/static/branding/chuangju-logo-on-dark.svg?v=20260824-chuangju-v1" alt="创剧" />
            </div>

            <div class="brand-content">
                <h1>把一个想法，变成一部好漫剧</h1>
                <p>创剧是面向普通创作者的 AI 视频工作台。无需专业制作经验，跟着清晰步骤，就能把灵感做成短剧、口播、广告、MV 或社媒视频。</p>
            </div>

            <div class="workflow-showcase" aria-label="创剧主要工作流程">
                <article class="workflow-card" style="--accent: #4D8DFF;">
                    <div class="workflow-preview" aria-hidden="true">
                        <div class="workflow-window-bar"><i></i><i></i><i></i></div>
                        <div class="story-ui">
                            <div class="story-sidebar"></div>
                            <div class="story-paper">
                                <div class="story-line"></div>
                                <div class="story-line short"></div>
                                <div class="story-line"></div>
                                <div class="story-action"></div>
                            </div>
                        </div>
                    </div>
                    <div class="workflow-copy">
                        <span class="workflow-index">01</span>
                        <span class="workflow-title">写剧本</span>
                        <span class="workflow-desc">从创意开始构建完整故事</span>
                    </div>
                </article>

                <article class="workflow-card" style="--accent: #8B6BFF;">
                    <div class="workflow-preview" aria-hidden="true">
                        <div class="workflow-window-bar"><i></i><i></i><i></i></div>
                        <div class="shot-ui">
                            <div class="shot-card"><div class="shot-image"></div></div>
                            <div class="shot-card"><div class="shot-image"></div></div>
                            <div class="shot-card"><div class="shot-image"></div></div>
                        </div>
                    </div>
                    <div class="workflow-copy">
                        <span class="workflow-index">02</span>
                        <span class="workflow-title">做分镜</span>
                        <span class="workflow-desc">统一角色场景与镜头画面</span>
                    </div>
                </article>

                <article class="workflow-card" style="--accent: #22C7C9;">
                    <div class="workflow-preview" aria-hidden="true">
                        <div class="workflow-window-bar"><i></i><i></i><i></i></div>
                        <div class="final-ui">
                            <div class="final-frame"><span class="final-play"></span></div>
                            <div class="final-timeline"><i></i><i></i><i></i></div>
                        </div>
                    </div>
                    <div class="workflow-copy">
                        <span class="workflow-index">03</span>
                        <span class="workflow-title">出成片</span>
                        <span class="workflow-desc">画面、声音与剪辑一体完成</span>
                    </div>
                </article>
            </div>

            <div class="brand-footer">© 2026 创剧 · 把一个想法，变成一部好漫剧</div>
        </section>

        <section class="login-panel">
            <div class="login-card">
                <div class="mobile-brand">
                    <img class="brand-lockup" src="/static/branding/chuangju-logo-on-light.svg?v=20260824-chuangju-v1" alt="创剧" />
                </div>

                <h2>欢迎回来</h2>
                <p class="subtitle">登录后继续完成你的故事</p>

                <form onsubmit="handleLogin(event)">
                    <div class="input-group">
                        <input id="username" type="text" autocomplete="username" placeholder=" " required>
                        <label for="username">账号 / Email</label>
                    </div>

                    <div class="input-group">
                        <input id="password" type="password" autocomplete="current-password" placeholder=" " required>
                        <label for="password">密码</label>
                    </div>

                    <div class="form-row">
                        <label class="remember">
                            <input type="checkbox">
                            <span>记住我</span>
                        </label>
                        <a href="#" class="link">忘记密码?</a>
                    </div>

                    <button id="loginBtn" type="submit" class="login-button">
                        <span>进入创剧</span>
                        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
                    </button>
                </form>

                <div id="errorMessage" class="error hidden"></div>
            </div>
        </section>
    </main>

    <script>
        const TOKEN_KEY = 'auth_token';
        const USERNAME_KEY = 'username';
        const USER_ID_KEY = 'user_id';
        const defaultButtonContent = document.getElementById('loginBtn').innerHTML;

        if (localStorage.getItem(TOKEN_KEY)) {
            window.location.href = '/projects';
        }

        async function login(username, password) {
            const response = await fetch('/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            });

            let payload = null;
            try {
                payload = await response.json();
            } catch (error) {
                payload = null;
            }

            if (!response.ok) {
                const message = payload && (payload.detail || payload.error);
                throw new Error(message || '\u767b\u5f55\u5931\u8d25');
            }

            if (payload && payload.token) {
                localStorage.setItem(TOKEN_KEY, payload.token);
                localStorage.setItem(USERNAME_KEY, payload.username || username);
                localStorage.setItem(USER_ID_KEY, payload.user_id || payload.username || username);
            }

            return payload || {};
        }

        async function handleLogin(event) {
            if (event) event.preventDefault();
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();
            const loginBtn = document.getElementById('loginBtn');
            const errorMsg = document.getElementById('errorMessage');

            if (!username || !password) {
                errorMsg.textContent = '\u8bf7\u8f93\u5165\u7528\u6237\u540d\u548c\u5bc6\u7801';
                errorMsg.classList.remove('hidden');
                return;
            }

            errorMsg.classList.add('hidden');
            loginBtn.disabled = true;
            loginBtn.innerHTML = '<span>\u767b\u5f55\u4e2d...</span><span class="loader" aria-hidden="true"></span>';

            try {
                const result = await login(username, password);
                if (result.success || result.token) {
                    window.location.href = '/projects';
                } else {
                    throw new Error(result.error || '\u767b\u5f55\u5931\u8d25');
                }
            } catch (error) {
                console.error('\u767b\u5f55\u5931\u8d25:', error);
                errorMsg.textContent = error.message || '\u767b\u5f55\u5931\u8d25\uff0c\u8bf7\u68c0\u67e5\u7528\u6237\u540d\u548c\u5bc6\u7801';
                errorMsg.classList.remove('hidden');
                loginBtn.disabled = false;
                loginBtn.innerHTML = defaultButtonContent;
            }
        }
    </script>
</body>
</html>
