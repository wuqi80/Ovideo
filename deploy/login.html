<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MESSIAH - 登录</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/lucide@0.469.0/dist/umd/lucide.min.js"></script>
    
    <!-- Three.js 依赖 -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.149.0/build/three.min.js"></script>
    
    <style>
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: #000000; 
            color: #e2e8f0; 
        }
        
        /* 粒子特效容器 */
        #particle-background {
            position: absolute;
            inset: 0;
            z-index: 0;
            overflow: hidden;
        }
        .login-glass {
            background: rgba(15, 23, 42, 0.4);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
        }
        .input-group input:focus ~ label,
        .input-group input:not(:placeholder-shown) ~ label {
            transform: translateY(-24px) scale(0.85);
            color: #818cf8;
        }
        .loader-spin { 
            animation: spin 1s linear infinite; 
        }
        @keyframes spin { 
            from { transform: rotate(0deg); } 
            to { transform: rotate(360deg); } 
        }
        
        /* 响应式设计 */
        html, body { 
            min-width: 100%;
            overflow-x: hidden;
        }
        
        /* 小屏幕适配 */
        @media (max-width: 768px) {
            .login-glass {
                padding: 2rem;
            }
            h1 {
                font-size: 1.5rem;
            }
        }
    </style>
</head>
<body class="h-screen flex items-center justify-center overflow-hidden">
    
    <!-- 粒子特效背景容器 -->
    <div id="particle-background"></div>
    
    <!-- 登录卡片 -->
    <div class="login-glass p-10 rounded-2xl w-full max-w-md relative z-10 mx-4">
        <div class="text-center mb-8">
            <!-- Logo -->
            <div class="mx-auto mb-6 flex items-center justify-center">
                <img src="/static/image_1ca1c5.png" alt="MESSIAH Logo" class="h-12 object-contain invert drop-shadow-lg">
            </div>
            <h1 class="text-2xl font-bold text-white tracking-tight">MESSIAH</h1>
            <p class="text-slate-400 text-xs uppercase tracking-widest mt-1">Innovative Technology & Design</p>
        </div>
        
        <form onsubmit="handleLogin(event)" class="space-y-6">
            <div class="input-group relative">
                <input type="text" id="username" class="w-full bg-transparent border-b border-slate-500 py-2 text-white outline-none focus:border-indigo-500 transition-colors peer" placeholder=" " required>
                <label for="username" class="absolute left-0 top-2 text-slate-400 text-sm transition-all pointer-events-none peer-focus:text-indigo-500">账号 / Email</label>
            </div>
            
            <div class="input-group relative">
                <input type="password" id="password" class="w-full bg-transparent border-b border-slate-500 py-2 text-white outline-none focus:border-indigo-500 transition-colors peer" placeholder=" " required>
                <label for="password" class="absolute left-0 top-2 text-slate-400 text-sm transition-all pointer-events-none peer-focus:text-indigo-500">密码</label>
            </div>
            
            <div class="flex items-center justify-between text-xs text-slate-400">
                <label class="flex items-center gap-2 cursor-pointer hover:text-slate-300">
                    <input type="checkbox" class="rounded bg-slate-700 border-slate-600 text-indigo-600 focus:ring-0">
                    记住我
                </label>
                <a href="#" class="hover:text-indigo-400 transition-colors">忘记密码?</a>
            </div>
            
            <button type="submit" id="loginBtn" class="w-full py-3 bg-white text-slate-900 font-bold rounded-lg shadow-[0_0_20px_rgba(255,255,255,0.15)] hover:shadow-[0_0_30px_rgba(255,255,255,0.3)] hover:bg-white/90 transition-all active:scale-[0.98] flex items-center justify-center gap-2 group">
                <span>进入系统</span>
                <i data-lucide="arrow-right" class="w-4 h-4 group-hover:translate-x-1 transition-transform"></i>
            </button>
        </form>
        
        <div id="errorMessage" class="mt-4 text-sm text-red-400 text-center hidden"></div>
    </div>

    <!-- 引入认证和API模块 -->
    <script src="/static/js/auth.js"></script>
    <script src="/static/js/api.js"></script>
    
    <!-- 粒子特效组件（纯Three.js，100%可靠） -->
    <script>
        (function() {
            // 检查Three.js是否加载成功
            if (typeof THREE === 'undefined') {
                console.error('❌ Three.js加载失败，使用降级背景');
                document.getElementById('particle-background').innerHTML = `
                    <div style="position: absolute; inset: 0; background: linear-gradient(135deg, #0a0a1a 0%, #1a0a2e 50%, #0a0a1a 100%);"></div>
                `;
                return;
            }
            
            console.log('✅ Three.js已加载，初始化粒子特效...');
            
            // 创建场景
            const scene = new THREE.Scene();
            scene.background = new THREE.Color('#010103');
            scene.fog = new THREE.Fog('#010103', 40, 300);
            
            // 创建相机
            const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.z = 45;
            
            // 创建渲染器
            const container = document.getElementById('particle-background');
            const renderer = new THREE.WebGLRenderer({ 
                antialias: false, 
                alpha: false,
                powerPreference: 'high-performance'
            });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            container.appendChild(renderer.domElement);
            
            // 生成粒子纹理
            const spriteCanvas = document.createElement('canvas');
            spriteCanvas.width = 64;
            spriteCanvas.height = 64;
            const spriteCtx = spriteCanvas.getContext('2d');
            const gradient = spriteCtx.createRadialGradient(32, 32, 0, 32, 32, 32);
            gradient.addColorStop(0, 'rgba(255, 255, 255, 1)');
            gradient.addColorStop(0.3, 'rgba(255, 255, 255, 0.8)');
            gradient.addColorStop(0.5, 'rgba(120, 220, 255, 0.5)');
            gradient.addColorStop(1, 'rgba(0, 0, 0, 0)');
            spriteCtx.fillStyle = gradient;
            spriteCtx.fillRect(0, 0, 64, 64);
            const texture = new THREE.CanvasTexture(spriteCanvas);
            
            // 创建背景粒子（星空）
            const bgCount = 20000;
            const bgGeometry = new THREE.BufferGeometry();
            const bgPositions = new Float32Array(bgCount * 3);
            const bgColors = new Float32Array(bgCount * 3);
            
            for (let i = 0; i < bgCount; i++) {
                const i3 = i * 3;
                const r = 200 + Math.random() * 300;
                const theta = 2 * Math.PI * Math.random();
                const phi = Math.acos(2 * Math.random() - 1);
                
                bgPositions[i3] = r * Math.sin(phi) * Math.cos(theta);
                bgPositions[i3 + 1] = r * Math.sin(phi) * Math.sin(theta);
                bgPositions[i3 + 2] = r * Math.cos(phi);
                
                if (Math.random() > 0.5) {
                    bgPositions[i3 + 1] *= 0.2;
                    bgPositions[i3] *= 1.5;
                    bgPositions[i3 + 2] *= 1.5;
                }
                
                const shade = Math.random();
                if (shade > 0.9) {
                    bgColors[i3] = 1.0; bgColors[i3+1] = 1.0; bgColors[i3+2] = 1.0;
                } else if (shade > 0.6) {
                    bgColors[i3] = 0.4; bgColors[i3+1] = 0.8; bgColors[i3+2] = 1.0;
                } else {
                    bgColors[i3] = 0.4; bgColors[i3+1] = 0.2; bgColors[i3+2] = 0.6;
                }
            }
            
            bgGeometry.setAttribute('position', new THREE.BufferAttribute(bgPositions, 3));
            bgGeometry.setAttribute('color', new THREE.BufferAttribute(bgColors, 3));
            
            const bgMaterial = new THREE.PointsMaterial({
                size: 2.5,
                map: texture,
                transparent: true,
                opacity: 0.8,
                vertexColors: true,
                blending: THREE.AdditiveBlending,
                depthWrite: false,
                sizeAttenuation: true
            });
            
            const bgParticles = new THREE.Points(bgGeometry, bgMaterial);
            scene.add(bgParticles);
            
            // 创建前景交互粒子
            const fgCount = 12000;
            const fgGeometry = new THREE.BufferGeometry();
            const fgPositions = new Float32Array(fgCount * 3);
            const fgColors = new Float32Array(fgCount * 3);
            
            // 初始形状：星云
            for (let i = 0; i < fgCount; i++) {
                const i3 = i * 3;
                const r = (Math.random() - 0.5) * 120;
                const theta = 2 * Math.PI * Math.random();
                const phi = Math.acos(2 * Math.random() - 1);
                fgPositions[i3] = r * Math.sin(phi) * Math.cos(theta);
                fgPositions[i3 + 1] = r * Math.sin(phi) * Math.sin(theta);
                fgPositions[i3 + 2] = (Math.random() - 0.5) * 60;
            }
            
            const c1 = new THREE.Color('#67e8f9');
            const c2 = new THREE.Color('#d8b4fe');
            for (let i = 0; i < fgCount; i++) {
                const mixed = Math.random() > 0.5 ? c1 : c2;
                fgColors[i * 3] = mixed.r;
                fgColors[i * 3 + 1] = mixed.g;
                fgColors[i * 3 + 2] = mixed.b;
            }
            
            fgGeometry.setAttribute('position', new THREE.BufferAttribute(fgPositions, 3));
            fgGeometry.setAttribute('color', new THREE.BufferAttribute(fgColors, 3));
            
            const fgMaterial = new THREE.PointsMaterial({
                size: 0.4,
                map: texture,
                transparent: true,
                depthWrite: false,
                vertexColors: true,
                blending: THREE.AdditiveBlending,
                sizeAttenuation: true,
                opacity: 1.0
            });
            
            const fgParticles = new THREE.Points(fgGeometry, fgMaterial);
            scene.add(fgParticles);
            
            // 鼠标交互
            const mouse = new THREE.Vector2(10000, 10000);
            const raycaster = new THREE.Raycaster();
            let clickEffect = null;
            
            window.addEventListener('mousemove', (event) => {
                mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
                mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
            });
            
            window.addEventListener('click', (event) => {
                clickEffect = {
                    pos: new THREE.Vector3(
                        (event.clientX / window.innerWidth) * 2 - 1,
                        -(event.clientY / window.innerHeight) * 2 + 1,
                        0
                    ),
                    time: Date.now()
                };
            });
            
            // 形状切换
            const shapes = ['nebula', 'humanoid', 'dna', 'sphere', 'butterfly'];
            let currentShapeIndex = 0;
            let targetPositions = new Float32Array(fgPositions);
            
            function generateShape(type) {
                const positions = new Float32Array(fgCount * 3);
                for (let i = 0; i < fgCount; i++) {
                    const i3 = i * 3;
                    let x = 0, y = 0, z = 0;
                    
                    if (type === 'nebula') {
                        const r = (Math.random() - 0.5) * 120;
                        const theta = 2 * Math.PI * Math.random();
                        const phi = Math.acos(2 * Math.random() - 1);
                        x = r * Math.sin(phi) * Math.cos(theta);
                        y = r * Math.sin(phi) * Math.sin(theta);
                        z = (Math.random() - 0.5) * 60;
                    } else if (type === 'sphere') {
                        const radius = 18;
                        const phi = Math.acos(-1 + (2 * i) / fgCount);
                        const theta = Math.sqrt(fgCount * Math.PI) * phi;
                        x = radius * Math.cos(theta) * Math.sin(phi);
                        y = radius * Math.sin(theta) * Math.sin(phi);
                        z = radius * Math.cos(phi);
                    } else if (type === 'dna') {
                        const radius = 8;
                        const turns = 6;
                        const t = (i / fgCount) * Math.PI * 2 * turns;
                        const strand = i % 2 === 0 ? 1 : -1;
                        x = radius * Math.cos(t + (strand * Math.PI));
                        y = (i / fgCount) * 80 - 40;
                        z = radius * Math.sin(t + (strand * Math.PI));
                        x += (Math.random() - 0.5) * 1;
                        y += (Math.random() - 0.5) * 1;
                        z += (Math.random() - 0.5) * 1;
                    } else if (type === 'humanoid') {
                        const seed = Math.random();
                        if (seed < 0.15) {
                            const r = 3;
                            const u = Math.random();
                            const v = Math.random();
                            const theta = 2 * Math.PI * u;
                            const phi = Math.acos(2 * v - 1);
                            x = r * Math.sin(phi) * Math.cos(theta);
                            y = r * Math.sin(phi) * Math.sin(theta) + 14;
                            z = r * Math.cos(phi);
                        } else if (seed < 0.5) {
                            const w = 5, h = 12, d = 3;
                            x = (Math.random() - 0.5) * w;
                            y = (Math.random() - 0.5) * h + 5;
                            z = (Math.random() - 0.5) * d;
                        } else if (seed < 0.75) {
                            const isLeft = Math.random() > 0.5;
                            x = isLeft ? -4 : 4;
                            y = (Math.random() * 10) + 2;
                            z = (Math.random() - 0.5) * 2;
                            x += (Math.random() - 0.5) * 2;
                        } else {
                            const isLeft = Math.random() > 0.5;
                            x = isLeft ? -2 : 2;
                            y = (Math.random() * 12) - 12;
                            z = (Math.random() - 0.5) * 2.5;
                            x += (Math.random() - 0.5) * 1.5;
                        }
                    } else if (type === 'butterfly') {
                        const t = (i / fgCount) * 24 * Math.PI;
                        const r = Math.exp(Math.sin(t)) - 2 * Math.cos(4 * t) + Math.pow(Math.sin((2 * t - Math.PI) / 24), 5);
                        const scale = 6;
                        x = r * Math.cos(t) * scale;
                        y = r * Math.sin(t) * scale;
                        z = Math.abs(x) * 0.5 * Math.sin(t);
                        const tempY = y;
                        y = y * Math.cos(Math.PI/4) - z * Math.sin(Math.PI/4);
                        z = tempY * Math.sin(Math.PI/4) + z * Math.cos(Math.PI/4);
                    }
                    
                    positions[i3] = x;
                    positions[i3 + 1] = y;
                    positions[i3 + 2] = z;
                }
                return positions;
            }
            
            // 每8秒切换形状
            setInterval(() => {
                currentShapeIndex = (currentShapeIndex + 1) % shapes.length;
                targetPositions = generateShape(shapes[currentShapeIndex]);
                console.log('🔄 形状切换:', shapes[currentShapeIndex]);
            }, 8000);
            
            // 动画循环
            const clock = new THREE.Clock();
            
            function animate() {
                requestAnimationFrame(animate);
                
                const time = clock.getElapsedTime();
                
                // 背景旋转
                bgParticles.rotation.y = time * 0.02;
                bgParticles.rotation.z = time * 0.005;
                
                // 前景摆动
                fgParticles.position.x = Math.sin(time * 0.2) * 25;
                fgParticles.position.y = Math.cos(time * 0.15) * 6;
                fgParticles.rotation.y = Math.sin(time * 0.1) * 0.3;
                
                // 形状变换 + 鼠标交互
                const posAttr = fgGeometry.attributes.position;
                const colorAttr = fgGeometry.attributes.color;
                
                // 计算鼠标在3D空间的位置
                raycaster.setFromCamera(mouse, camera);
                const mousePos = new THREE.Vector3();
                const plane = new THREE.Plane(new THREE.Vector3(0, 0, 1), 0);
                raycaster.ray.intersectPlane(plane, mousePos);
                mousePos.sub(fgParticles.position);
                
                // 冲击波效果
                let shockwaveRadius = 0;
                let shockwaveActive = false;
                const shockCenter = new THREE.Vector3();
                
                if (clickEffect) {
                    const elapsed = Date.now() - clickEffect.time;
                    if (elapsed < 1500) {
                        shockwaveActive = true;
                        shockwaveRadius = (elapsed / 1000) * 80;
                        const clickWorldPos = new THREE.Vector3();
                        const clickPlane = new THREE.Plane(new THREE.Vector3(0, 0, 1), 0);
                        const clickRay = new THREE.Raycaster();
                        clickRay.setFromCamera(new THREE.Vector2(clickEffect.pos.x, clickEffect.pos.y), camera);
                        clickRay.ray.intersectPlane(clickPlane, clickWorldPos);
                        shockCenter.copy(clickWorldPos).sub(fgParticles.position);
                    } else {
                        clickEffect = null;
                    }
                }
                
                for (let i = 0; i < fgCount; i++) {
                    const i3 = i * 3;
                    const cx = posAttr.array[i3];
                    const cy = posAttr.array[i3 + 1];
                    const cz = posAttr.array[i3 + 2];
                    const tx = targetPositions[i3];
                    const ty = targetPositions[i3 + 1];
                    const tz = targetPositions[i3 + 2];
                    
                    const speed = 0.02 + (Math.sin(i * 0.1) * 0.015);
                    let nx = cx + (tx - cx) * speed;
                    let ny = cy + (ty - cy) * speed;
                    let nz = cz + (tz - cz) * speed;
                    
                    // 鼠标排斥
                    const dx = nx - mousePos.x;
                    const dy = ny - mousePos.y;
                    const dz = nz - mousePos.z;
                    const distSq = dx * dx + dy * dy + (dz * dz * 0.2);
                    const forceRadius = 100;
                    
                    if (distSq < forceRadius) {
                        const dist = Math.sqrt(distSq);
                        const force = (Math.sqrt(forceRadius) - dist) / Math.sqrt(forceRadius);
                        const angle = Math.atan2(dy, dx);
                        const repulsionStrength = 5.0;
                        nx += Math.cos(angle) * force * repulsionStrength;
                        ny += Math.sin(angle) * force * repulsionStrength;
                        colorAttr.array[i3] = 1.0;
                        colorAttr.array[i3 + 1] = 1.0;
                        colorAttr.array[i3 + 2] = 1.0;
                    } else {
                        colorAttr.array[i3] = fgColors[i3] * 0.05 + colorAttr.array[i3] * 0.95;
                        colorAttr.array[i3 + 1] = fgColors[i3 + 1] * 0.05 + colorAttr.array[i3 + 1] * 0.95;
                        colorAttr.array[i3 + 2] = fgColors[i3 + 2] * 0.05 + colorAttr.array[i3 + 2] * 0.95;
                    }
                    
                    // 冲击波
                    if (shockwaveActive) {
                        const sdx = nx - shockCenter.x;
                        const sdy = ny - shockCenter.y;
                        const sdz = nz - shockCenter.z;
                        const sDist = Math.sqrt(sdx*sdx + sdy*sdy + sdz*sdz);
                        const ringWidth = 12;
                        const diff = sDist - shockwaveRadius;
                        
                        if (Math.abs(diff) < ringWidth) {
                            const power = (1 - Math.abs(diff) / ringWidth) * 8.0;
                            const sAngleH = Math.atan2(sdy, sdx);
                            const sAngleV = Math.atan2(sdz, Math.sqrt(sdx*sdx + sdy*sdy));
                            nx += Math.cos(sAngleH) * Math.cos(sAngleV) * power;
                            ny += Math.sin(sAngleH) * Math.cos(sAngleV) * power;
                            nz += Math.sin(sAngleV) * power;
                            colorAttr.array[i3] = 1;
                            colorAttr.array[i3 + 1] = 0;
                            colorAttr.array[i3 + 2] = 0.5;
                        }
                    }
                    
                    posAttr.array[i3] = nx;
                    posAttr.array[i3 + 1] = ny;
                    posAttr.array[i3 + 2] = nz;
                }
                
                posAttr.needsUpdate = true;
                colorAttr.needsUpdate = true;
                
                renderer.render(scene, camera);
            }
            
            // 响应式
            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });
            
            // 启动动画
            animate();
            console.log('✅ 粒子特效已启动（纯Three.js）');
        })();
    </script>
    
    <!-- 登录逻辑 -->
    <script>
        // 如果已登录，直接跳转到阶段1（剧本编辑器）
        if (localStorage.getItem('auth_token')) {
            window.location.href = '/editor';
        }
        
        // 初始化图标
        if(typeof lucide !== 'undefined') lucide.createIcons();
        
        // 登录处理
        async function handleLogin(event) {
            if (event) event.preventDefault();
            
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();
            const loginBtn = document.getElementById('loginBtn');
            const errorMsg = document.getElementById('errorMessage');
            
            if (!username || !password) {
                errorMsg.textContent = '请输入用户名和密码';
                errorMsg.classList.remove('hidden');
                return;
            }
            
            // 禁用按钮
            loginBtn.disabled = true;
            loginBtn.innerHTML = '<span>登录中...</span><i data-lucide="loader-2" class="w-4 h-4 loader-spin"></i>';
            if(typeof lucide !== 'undefined') lucide.createIcons();
            
            try {
                const result = await Auth.login(username, password);
                
                if (result.success) {
                    // 登录成功，跳转到阶段1（剧本编辑器）
                    window.location.href = '/editor';
                } else {
                    throw new Error(result.error || '登录失败');
                }
            } catch (error) {
                console.error('登录失败:', error);
                errorMsg.textContent = error.message || '登录失败，请检查用户名和密码';
                errorMsg.classList.remove('hidden');
                
                // 恢复按钮
                loginBtn.disabled = false;
                loginBtn.innerHTML = '<span>进入系统</span><i data-lucide="arrow-right" class="w-4 h-4 group-hover:translate-x-1 transition-transform"></i>';
                if(typeof lucide !== 'undefined') lucide.createIcons();
            }
        }
    </script>
</body>
</html>
