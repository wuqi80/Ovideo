<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MESSIAH - 登录</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/lucide@0.469.0/dist/umd/lucide.min.js"></script>
    <script>
      // refactor/v2：登录页换肤为参考仓 Atlassian 企业级浅色（左右分栏）。
      tailwind.config = {
        theme: { extend: {
          fontFamily: { sans: ['Noto Sans SC','system-ui','sans-serif'] },
          colors: {
            n0:'#FFFFFF', n10:'#FAFBFC', n20:'#F4F5F7', n30:'#EBECF0', n40:'#DFE1E6',
            n50:'#C1C7D0', n100:'#7A869A', n200:'#6B778C', n300:'#5E6C84', n500:'#42526E',
            n700:'#253858', n800:'#172B4D', n900:'#091E42',
            primary:{DEFAULT:'#0052CC', hover:'#0065FF', active:'#0747A6', light:'#DEEBFF'},
            danger:'#FF5630', b500:'#0747A6', b300:'#0065FF',
          },
        }}
      }
    </script>
    <style>
        body { font-family: 'Noto Sans SC', system-ui, sans-serif; }
        /* 浮起标签 */
        .input-group input:focus ~ label,
        .input-group input:not(:placeholder-shown) ~ label {
            transform: translateY(-22px) scale(0.82);
            color: #0052CC;
        }
        .loader-spin { animation: spin 1s linear infinite; }
        @keyframes spin { from { transform: rotate(0deg);} to { transform: rotate(360deg);} }
        /* 左侧品牌面板的柔光点缀 */
        .brand-orbs::before, .brand-orbs::after {
            content:''; position:absolute; border-radius:9999px; filter: blur(40px); opacity:.35;
        }
        .brand-orbs::before { width:320px; height:320px; background:#4C9AFF; top:-60px; right:-40px; }
        .brand-orbs::after  { width:260px; height:260px; background:#0747A6; bottom:-50px; left:-30px; }
    </style>
</head>
<body class="h-screen overflow-hidden bg-n20 text-n800">
    <div class="h-full flex">
        <!-- 左侧：品牌展示面板 -->
        <div class="brand-orbs relative hidden md:flex md:w-1/2 lg:w-7/12 flex-col justify-between p-12 overflow-hidden
                    bg-gradient-to-br from-primary via-[#0a5ad6] to-b500 text-white">
            <div class="relative z-10 flex items-center gap-3">
                <img src="/static/image_1ca1c5.png" alt="MESSIAH" class="h-10 object-contain invert drop-shadow">
                <span class="text-xl font-bold tracking-tight">MESSIAH</span>
            </div>

            <div class="relative z-10 max-w-md">
                <h1 class="text-3xl lg:text-4xl font-bold leading-snug mb-3">AI 短剧创作平台</h1>
                <p class="text-white/75 text-sm mb-10">从剧本到成片，一站式智能生成工作流。</p>
                <div class="space-y-5">
                    <div class="flex items-start gap-3">
                        <div class="shrink-0 w-9 h-9 rounded-md bg-white/15 flex items-center justify-center"><i data-lucide="file-text" class="w-4 h-4"></i></div>
                        <div><div class="font-medium text-sm">智能剧本与分镜</div><div class="text-white/60 text-xs mt-0.5">小说一键转剧本，自动拆镜头</div></div>
                    </div>
                    <div class="flex items-start gap-3">
                        <div class="shrink-0 w-9 h-9 rounded-md bg-white/15 flex items-center justify-center"><i data-lucide="palette" class="w-4 h-4"></i></div>
                        <div><div class="font-medium text-sm">多模型生成引擎</div><div class="text-white/60 text-xs mt-0.5">文本 / 图像 / 视频 / 配音全覆盖</div></div>
                    </div>
                    <div class="flex items-start gap-3">
                        <div class="shrink-0 w-9 h-9 rounded-md bg-white/15 flex items-center justify-center"><i data-lucide="clapperboard" class="w-4 h-4"></i></div>
                        <div><div class="font-medium text-sm">一键合成成片</div><div class="text-white/60 text-xs mt-0.5">分镜→视频→配音自动对齐导出</div></div>
                    </div>
                </div>
            </div>

            <div class="relative z-10 text-white/50 text-xs">© 2026 MESSIAH · Innovative Technology &amp; Design</div>
        </div>

        <!-- 右侧：登录表单 -->
        <div class="flex-1 flex items-center justify-center p-6 bg-n0">
            <div class="w-full max-w-sm">
                <!-- 小屏 logo -->
                <div class="md:hidden flex items-center justify-center gap-2 mb-8">
                    <img src="/static/image_1ca1c5.png" alt="MESSIAH" class="h-9 object-contain">
                    <span class="text-lg font-bold text-n800">MESSIAH</span>
                </div>

                <h2 class="text-2xl font-semibold text-n800 mb-1">欢迎回来</h2>
                <p class="text-n300 text-sm mb-8">登录以继续你的创作</p>

                <form onsubmit="handleLogin(event)" class="space-y-6">
                    <div class="input-group relative">
                        <input type="text" id="username" placeholder=" " required
                            class="w-full bg-n0 border border-n40 rounded px-3 pt-2.5 pb-2 text-sm text-n800 outline-none focus:border-primary focus:ring-2 focus:ring-primary/20 transition-colors peer">
                        <label for="username" class="absolute left-3 top-2.5 text-n200 text-sm transition-all pointer-events-none bg-n0 px-1 peer-focus:text-primary">账号 / Email</label>
                    </div>

                    <div class="input-group relative">
                        <input type="password" id="password" placeholder=" " required
                            class="w-full bg-n0 border border-n40 rounded px-3 pt-2.5 pb-2 text-sm text-n800 outline-none focus:border-primary focus:ring-2 focus:ring-primary/20 transition-colors peer">
                        <label for="password" class="absolute left-3 top-2.5 text-n200 text-sm transition-all pointer-events-none bg-n0 px-1 peer-focus:text-primary">密码</label>
                    </div>

                    <div class="flex items-center justify-between text-xs text-n300">
                        <label class="flex items-center gap-2 cursor-pointer hover:text-n700">
                            <input type="checkbox" class="rounded accent-primary"> 记住我
                        </label>
                        <a href="#" class="hover:text-primary transition-colors">忘记密码?</a>
                    </div>

                    <button type="submit" id="loginBtn"
                        class="w-full py-2.5 bg-primary hover:bg-primary-hover text-white font-medium rounded text-sm shadow-sm transition-all active:scale-[0.99] flex items-center justify-center gap-2 group">
                        <span>进入系统</span>
                        <i data-lucide="arrow-right" class="w-4 h-4 group-hover:translate-x-0.5 transition-transform"></i>
                    </button>
                </form>

                <div id="errorMessage" class="mt-4 text-sm text-danger text-center hidden"></div>
            </div>
        </div>
    </div>

    <!-- 认证 / API 模块（保持不变） -->
    <script src="/static/js/auth.js"></script>
    <script src="/static/js/api.js"></script>

    <script>
        // 已登录则直接进入主页（项目中心）
        if (localStorage.getItem('auth_token')) {
            window.location.href = '/projects';
        }
        if (typeof lucide !== 'undefined') lucide.createIcons();

        async function handleLogin(event) {
            if (event) event.preventDefault();
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();
            const loginBtn = document.getElementById('loginBtn');
            const errorMsg = document.getElementById('errorMessage');

            if (!username || !password) {
                errorMsg.textContent = '请输入用户名和密码';
                errorMsg.classList.remove('hidden');
                return;
            }

            loginBtn.disabled = true;
            loginBtn.innerHTML = '<span>登录中...</span><i data-lucide="loader-2" class="w-4 h-4 loader-spin"></i>';
            if (typeof lucide !== 'undefined') lucide.createIcons();

            try {
                const result = await Auth.login(username, password);
                if (result.success) {
                    window.location.href = '/projects';
                } else {
                    throw new Error(result.error || '登录失败');
                }
            } catch (error) {
                console.error('登录失败:', error);
                errorMsg.textContent = error.message || '登录失败，请检查用户名和密码';
                errorMsg.classList.remove('hidden');
                loginBtn.disabled = false;
                loginBtn.innerHTML = '<span>进入系统</span><i data-lucide="arrow-right" class="w-4 h-4 group-hover:translate-x-0.5 transition-transform"></i>';
                if (typeof lucide !== 'undefined') lucide.createIcons();
            }
        }
    </script>
</body>
</html>
