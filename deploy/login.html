<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="/static/favicon.svg" type="image/svg+xml" />
    <title>MECHA - 登录</title>
    <style>
        :root {
            --n0: #FFFFFF;
            --n20: #F4F5F7;
            --n30: #EBECF0;
            --n40: #DFE1E6;
            --n100: #7A869A;
            --n200: #6B778C;
            --n300: #5E6C84;
            --n700: #253858;
            --n800: #172B4D;
            --primary: #0052CC;
            --primary-hover: #0065FF;
            --primary-active: #0747A6;
            --primary-light: #DEEBFF;
            --danger: #FF5630;
            --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Helvetica Neue", Arial, sans-serif;
        }

        * { box-sizing: border-box; }

        html,
        body {
            margin: 0;
            min-height: 100%;
            overflow-x: hidden;
            font-family: var(--font-sans);
            background: var(--n20);
            color: var(--n800);
            -webkit-font-smoothing: antialiased;
        }

        body {
            min-height: 100vh;
            display: flex;
        }

        .shell {
            min-height: 100vh;
            width: 100%;
            display: flex;
        }

        .brand-panel {
            position: relative;
            display: flex;
            width: 58%;
            min-width: 420px;
            flex-direction: column;
            justify-content: space-between;
            padding: 48px;
            background: linear-gradient(135deg, #0052CC 0%, #0A5AD6 56%, #0747A6 100%);
            color: white;
            overflow: hidden;
        }

        .brand-panel::before {
            content: "";
            position: absolute;
            inset: 0;
            background:
                linear-gradient(rgba(255,255,255,0.08) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.08) 1px, transparent 1px);
            background-size: 36px 36px;
            mask-image: linear-gradient(to bottom, rgba(0,0,0,0.7), transparent 88%);
            pointer-events: none;
        }

        .brand-top,
        .brand-content,
        .brand-footer {
            position: relative;
            z-index: 1;
        }

        .brand-top,
        .mobile-brand,
        .feature-row {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo {
            width: 40px;
            height: 40px;
            border-radius: 9px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 22px;
            background: rgba(255,255,255,0.92);
            color: var(--primary);
        }

        .mobile-brand .logo {
            width: 36px;
            height: 36px;
            background: var(--primary);
            color: white;
            font-size: 20px;
        }

        .brand-name {
            font-size: 20px;
            line-height: 1;
            font-weight: 700;
        }

        .brand-content {
            max-width: 420px;
        }

        .brand-content h1 {
            margin: 0 0 12px;
            font-size: clamp(30px, 3.2vw, 42px);
            line-height: 1.2;
            font-weight: 700;
        }

        .brand-content p {
            margin: 0 0 40px;
            color: rgba(255,255,255,0.76);
            font-size: 14px;
            line-height: 1.8;
        }

        .feature-list {
            display: grid;
            gap: 20px;
        }

        .feature-icon {
            width: 36px;
            height: 36px;
            flex: 0 0 auto;
            border-radius: 7px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: rgba(255,255,255,0.16);
        }

        .feature-title {
            display: block;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .feature-desc,
        .brand-footer {
            display: block;
            color: rgba(255,255,255,0.62);
            font-size: 12px;
        }

        .login-panel {
            flex: 1;
            min-width: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background: var(--n0);
        }

        .login-card {
            width: 100%;
            max-width: 360px;
        }

        .mobile-brand {
            display: none;
            justify-content: center;
            margin-bottom: 32px;
        }

        h2 {
            margin: 0 0 4px;
            font-size: 24px;
            line-height: 1.3;
            font-weight: 650;
            color: var(--n800);
        }

        .subtitle {
            margin: 0 0 32px;
            color: var(--n300);
            font-size: 14px;
        }

        form {
            display: grid;
            gap: 24px;
        }

        .input-group {
            position: relative;
        }

        .input-group input[type="text"],
        .input-group input[type="password"] {
            width: 100%;
            height: 44px;
            border: 1px solid var(--n40);
            border-radius: 6px;
            background: var(--n0);
            color: var(--n800);
            font: inherit;
            font-size: 14px;
            outline: none;
            padding: 10px 12px 8px;
            transition: border-color 150ms ease, box-shadow 150ms ease;
        }

        .input-group input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(0,82,204,0.16);
        }

        .input-group label {
            position: absolute;
            left: 10px;
            top: 12px;
            padding: 0 4px;
            background: var(--n0);
            color: var(--n200);
            font-size: 14px;
            line-height: 1;
            pointer-events: none;
            transition: transform 150ms ease, color 150ms ease;
            transform-origin: left center;
        }

        .input-group input:focus + label,
        .input-group input:not(:placeholder-shown) + label {
            transform: translateY(-22px) scale(0.82);
            color: var(--primary);
        }

        .form-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            color: var(--n300);
            font-size: 12px;
        }

        .remember {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
        }

        .remember:hover,
        .link:hover {
            color: var(--n700);
        }

        .remember input {
            accent-color: var(--primary);
        }

        .link {
            color: inherit;
            text-decoration: none;
            transition: color 150ms ease;
        }

        .login-button {
            width: 100%;
            height: 42px;
            border: 0;
            border-radius: 6px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background: var(--primary);
            color: white;
            font: inherit;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 1px 2px rgba(9,30,66,0.16);
            transition: background-color 150ms ease, transform 150ms ease;
        }

        .login-button:hover {
            background: var(--primary-hover);
        }

        .login-button:active {
            transform: scale(0.99);
            background: var(--primary-active);
        }

        .login-button:disabled {
            cursor: wait;
            opacity: 0.72;
        }

        .icon {
            width: 16px;
            height: 16px;
            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
            fill: none;
        }

        .loader {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            border: 2px solid rgba(255,255,255,0.4);
            border-top-color: white;
            animation: spin 800ms linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .error {
            margin-top: 16px;
            min-height: 18px;
            color: var(--danger);
            text-align: center;
            font-size: 14px;
        }

        .hidden {
            display: none;
        }

        @media (max-width: 860px) {
            .brand-panel {
                display: none;
            }

            .mobile-brand {
                display: flex;
            }

            .login-panel {
                min-height: 100vh;
            }
        }
    </style>
</head>
<body>
    <main class="shell">
        <section class="brand-panel" aria-label="MECHA 创作平台">
            <div class="brand-top">
                <div class="logo">M</div>
                <div class="brand-name">MECHA</div>
            </div>

            <div class="brand-content">
                <h1>AI 短剧创作平台</h1>
                <p>从剧本到成片，一站式智能生成工作流。</p>
                <div class="feature-list">
                    <div class="feature-row">
                        <span class="feature-icon" aria-hidden="true">
                            <svg class="icon" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M8 13h8"/><path d="M8 17h6"/></svg>
                        </span>
                        <span>
                            <span class="feature-title">智能剧本与分镜</span>
                            <span class="feature-desc">小说一键转剧本，自动拆镜头</span>
                        </span>
                    </div>
                    <div class="feature-row">
                        <span class="feature-icon" aria-hidden="true">
                            <svg class="icon" viewBox="0 0 24 24"><path d="M12 22a9 9 0 1 0-9-9 7 7 0 0 0 7 7h1.5a1.5 1.5 0 0 0 0-3H10a2 2 0 0 1 0-4h4a2 2 0 0 1 0 4h-.5a1.5 1.5 0 0 0 0 3H14a8 8 0 0 0 8-8"/></svg>
                        </span>
                        <span>
                            <span class="feature-title">多模型生成引擎</span>
                            <span class="feature-desc">文本 / 图像 / 视频 / 配音全覆盖</span>
                        </span>
                    </div>
                    <div class="feature-row">
                        <span class="feature-icon" aria-hidden="true">
                            <svg class="icon" viewBox="0 0 24 24"><path d="M4 11h16v9a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2z"/><path d="M4 11 3 6l18-4 1 5z"/><path d="m8 5 3 5"/><path d="m15 3 3 5"/></svg>
                        </span>
                        <span>
                            <span class="feature-title">一键合成成片</span>
                            <span class="feature-desc">分镜到视频、配音自动对齐导出</span>
                        </span>
                    </div>
                </div>
            </div>

            <div class="brand-footer">© 2026 MECHA · Innovative Technology &amp; Design</div>
        </section>

        <section class="login-panel">
            <div class="login-card">
                <div class="mobile-brand">
                    <div class="logo">M</div>
                    <div class="brand-name">MECHA</div>
                </div>

                <h2>欢迎回来</h2>
                <p class="subtitle">登录以继续你的创作</p>

                <form onsubmit="handleLogin(event)">
                    <div class="input-group">
                        <input id="username" type="text" autocomplete="username" placeholder=" " required>
                        <label for="username">账号 / Email</label>
                    </div>

                    <div class="input-group">
                        <input id="password" type="password" autocomplete="current-password" placeholder=" " required>
                        <label for="password">密码</label>
                    </div>

                    <div class="form-row">
                        <label class="remember">
                            <input type="checkbox">
                            <span>记住我</span>
                        </label>
                        <a href="#" class="link">忘记密码?</a>
                    </div>

                    <button id="loginBtn" type="submit" class="login-button">
                        <span>进入系统</span>
                        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
                    </button>
                </form>

                <div id="errorMessage" class="error hidden"></div>
            </div>
        </section>
    </main>

    <script>
        const TOKEN_KEY = 'auth_token';
        const USERNAME_KEY = 'username';
        const defaultButtonContent = document.getElementById('loginBtn').innerHTML;

        if (localStorage.getItem(TOKEN_KEY)) {
            window.location.href = '/projects';
        }

        async function login(username, password) {
            const response = await fetch('/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            });

            let payload = null;
            try {
                payload = await response.json();
            } catch (error) {
                payload = null;
            }

            if (!response.ok) {
                const message = payload && (payload.detail || payload.error);
                throw new Error(message || '\u767b\u5f55\u5931\u8d25');
            }

            if (payload && payload.token) {
                localStorage.setItem(TOKEN_KEY, payload.token);
                localStorage.setItem(USERNAME_KEY, username);
            }

            return payload || {};
        }

        async function handleLogin(event) {
            if (event) event.preventDefault();
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();
            const loginBtn = document.getElementById('loginBtn');
            const errorMsg = document.getElementById('errorMessage');

            if (!username || !password) {
                errorMsg.textContent = '\u8bf7\u8f93\u5165\u7528\u6237\u540d\u548c\u5bc6\u7801';
                errorMsg.classList.remove('hidden');
                return;
            }

            errorMsg.classList.add('hidden');
            loginBtn.disabled = true;
            loginBtn.innerHTML = '<span>\u767b\u5f55\u4e2d...</span><span class="loader" aria-hidden="true"></span>';

            try {
                const result = await login(username, password);
                if (result.success || result.token) {
                    window.location.href = '/projects';
                } else {
                    throw new Error(result.error || '\u767b\u5f55\u5931\u8d25');
                }
            } catch (error) {
                console.error('\u767b\u5f55\u5931\u8d25:', error);
                errorMsg.textContent = error.message || '\u767b\u5f55\u5931\u8d25\uff0c\u8bf7\u68c0\u67e5\u7528\u6237\u540d\u548c\u5bc6\u7801';
                errorMsg.classList.remove('hidden');
                loginBtn.disabled = false;
                loginBtn.innerHTML = defaultButtonContent;
            }
        }
    </script>
</body>
</html>
