<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="登录创剧，继续完成你的 AI 视频作品。" />
    <meta name="theme-color" content="#5B49F0" />
    <link rel="icon" href="/favicon.svg?v=20260824-chuangju-v1" type="image/svg+xml" />
    <link rel="icon" href="/favicon.ico?v=20260824-chuangju-v1" sizes="any" />
    <link rel="icon" href="/favicon-32x32.png?v=20260824-chuangju-v1" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=20260824-chuangju-v1" />
    <title>创剧 · 登录</title>
    <style>
        :root {
            --n0: #FFFFFF;
            --n10: #FBFBF9;
            --n20: #F4F4F1;
            --n30: #F0F0EC;
            --n40: #E5E5E0;
            --n100: #9A9AA2;
            --n200: #8A8A94;
            --n300: #6A6A74;
            --n700: #22222B;
            --n800: #17171C;
            --primary: #5B49F0;
            --primary-hover: #4C3BD6;
            --primary-active: #4536C9;
            --primary-light: #ECE9FF;
            --purple: #8B6BFF;
            --pink: #FF9A6B;
            --green: #12B76A;
            --danger: #E5533C;
            --border-hover: #9A9AA2;
            --shadow-cascade: 0 24px 70px rgba(20, 20, 25, 0.18);
            --shadow-glow: 0 4px 14px rgba(91, 73, 240, 0.35);
            --font-sans: "Noto Sans SC", "Sora", "PingFang SC", "Microsoft YaHei", sans-serif;
        }

        * { box-sizing: border-box; }

        html,
        body {
            margin: 0;
            min-height: 100%;
            overflow-x: hidden;
            font-family: var(--font-sans);
            background: var(--n0);
            color: var(--n800);
            -webkit-font-smoothing: antialiased;
        }

        body {
            min-height: 100vh;
            display: flex;
        }

        .shell {
            min-height: 100vh;
            width: 100%;
            display: flex;
        }

        .brand-panel {
            position: relative;
            display: flex;
            width: 58%;
            min-width: 420px;
            flex-direction: column;
            justify-content: space-between;
            padding: 48px;
            background:
                radial-gradient(circle at 78% 18%, rgba(139, 107, 255, 0.55), transparent 32%),
                radial-gradient(circle at 18% 88%, rgba(255, 106, 61, 0.22), transparent 34%),
                linear-gradient(145deg, #5B49F0 0%, #3A2F8F 48%, #141419 100%);
            color: white;
            overflow: hidden;
        }

        .brand-panel::before {
            content: "";
            position: absolute;
            inset: 0;
            background:
                linear-gradient(rgba(255,255,255,0.1) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.1) 1px, transparent 1px);
            background-size: 40px 40px;
            mask-image: linear-gradient(to bottom, rgba(0,0,0,0.7), transparent 88%);
            pointer-events: none;
        }

        .brand-top,
        .brand-content,
        .brand-footer {
            position: relative;
            z-index: 1;
        }

        .brand-top,
        .mobile-brand,
        .feature-row {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand-lockup {
            width: min(240px, 54vw);
            height: auto;
            display: block;
            object-fit: contain;
        }

        .mobile-brand .brand-lockup {
            width: min(196px, 62vw);
        }

        .brand-content {
            max-width: 420px;
        }

        .brand-content h1 {
            margin: 0 0 12px;
            font-size: clamp(30px, 3.2vw, 42px);
            line-height: 1.08;
            font-weight: 600;
            letter-spacing: -0.4px;
        }

        .brand-content p {
            margin: 0 0 40px;
            color: rgba(255,255,255,0.76);
            font-size: 14px;
            line-height: 1.8;
        }

        .feature-list {
            display: grid;
            gap: 20px;
        }

        .feature-icon {
            width: 36px;
            height: 36px;
            flex: 0 0 auto;
            border: 1px solid rgba(255,255,255,0.22);
            border-radius: 10px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: rgba(255,255,255,0.12);
        }

        .feature-title {
            display: block;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .feature-desc,
        .brand-footer {
            display: block;
            color: rgba(255,255,255,0.62);
            font-size: 12px;
        }

        .login-panel {
            flex: 1;
            min-width: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background: var(--n20);
        }

        .login-card {
            width: 100%;
            max-width: 440px;
            background: var(--n0);
            border: 1px solid var(--n40);
            border-radius: 20px;
            padding: 40px 36px;
            box-shadow: 0 14px 44px rgba(20, 20, 25, 0.07);
        }

        .mobile-brand {
            display: none;
            justify-content: center;
            margin-bottom: 32px;
        }

        h2 {
            margin: 0 0 4px;
            font-family: "Sora", var(--font-sans);
            font-size: 32px;
            line-height: 1.3;
            font-weight: 700;
            letter-spacing: -0.4px;
            color: var(--n800);
        }

        .subtitle {
            margin: 0 0 32px;
            color: var(--n300);
            font-size: 16px;
            line-height: 1.6;
        }

        form {
            display: grid;
            gap: 24px;
        }

        .input-group {
            position: relative;
        }

        .input-group input[type="text"],
        .input-group input[type="password"] {
            width: 100%;
            height: 48px;
            border: 1px solid var(--n40);
            border-radius: 9px;
            background: var(--n0);
            color: var(--n800);
            font: inherit;
            font-size: 16px;
            outline: none;
            padding: 10px 12px 8px;
            transition: border-color 150ms ease, box-shadow 150ms ease;
        }

        .input-group input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(91,73,240,0.16);
        }

        .input-group label {
            position: absolute;
            left: 10px;
            top: 15px;
            padding: 0 4px;
            background: transparent;
            color: var(--n200);
            font-size: 15px;
            line-height: 1;
            pointer-events: none;
            transition: transform 150ms ease, color 150ms ease, background-color 150ms ease;
            transform-origin: left center;
        }

        .input-group input:focus + label,
        .input-group input:not(:placeholder-shown) + label,
        .input-group input:-webkit-autofill + label {
            transform: translateY(-22px) scale(0.82);
            background: var(--n0);
            color: var(--primary);
        }

        .input-group input:-webkit-autofill,
        .input-group input:-webkit-autofill:hover,
        .input-group input:-webkit-autofill:focus {
            -webkit-text-fill-color: var(--n800);
            caret-color: var(--n800);
            box-shadow: 0 0 0 1000px var(--n0) inset;
            transition: background-color 9999s ease-out 0s;
        }

        .form-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            color: var(--n300);
            font-size: 12px;
        }

        .remember {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
        }

        .remember:hover,
        .link:hover {
            color: var(--primary);
        }

        .remember input {
            accent-color: var(--primary);
        }

        .link {
            color: inherit;
            text-decoration: none;
            transition: color 150ms ease;
        }

        .login-button {
            width: 100%;
            height: 48px;
            border: 0;
            border-radius: 11px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background: linear-gradient(135deg, #5B49F0, #7A5BFF);
            color: white;
            font: inherit;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: var(--shadow-glow);
            transition: background-color 150ms ease, box-shadow 150ms ease, filter 150ms ease;
        }

        .login-button:hover {
            filter: brightness(1.06);
        }

        .login-button:active {
            filter: brightness(0.96);
        }

        .login-button:disabled {
            cursor: wait;
            opacity: 0.72;
        }

        .icon {
            width: 16px;
            height: 16px;
            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
            fill: none;
        }

        .loader {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            border: 2px solid rgba(255,255,255,0.4);
            border-top-color: white;
            animation: spin 800ms linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .error {
            margin-top: 16px;
            min-height: 18px;
            color: var(--danger);
            text-align: center;
            font-size: 14px;
        }

        .hidden {
            display: none;
        }

        @media (max-width: 992px) {
            .brand-panel {
                display: none;
            }

            .mobile-brand {
                display: flex;
            }

            .login-panel {
                min-height: 100vh;
            }
        }

        @media (max-width: 479px) {
            .login-panel {
                align-items: flex-start;
                padding: 72px 20px 32px;
            }

            .mobile-brand {
                justify-content: flex-start;
                margin-bottom: 48px;
            }

            h2 {
                font-size: 28px;
            }

            form {
                gap: 20px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                animation-duration: 0.01ms !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>
<body>
    <main class="shell">
        <section class="brand-panel" aria-label="创剧 · AI 视频创作平台">
            <div class="brand-top">
                <img class="brand-lockup" src="/static/branding/chuangju-logo-on-dark.svg?v=20260824-chuangju-v1" alt="创剧" />
            </div>

            <div class="brand-content">
                <h1>把一个想法，变成一部好故事</h1>
                <p>创剧是面向普通创作者的 AI 视频工作台。无需专业制作经验，跟着清晰步骤，就能把灵感做成短剧、口播、广告、MV 或社媒视频。</p>
                <div class="feature-list">
                    <div class="feature-row">
                        <span class="feature-icon" aria-hidden="true">
                            <svg class="icon" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M8 13h8"/><path d="M8 17h6"/></svg>
                        </span>
                        <span>
                            <span class="feature-title">先写故事，再拆镜头</span>
                            <span class="feature-desc">输入想法或原文，逐步生成剧本和分镜</span>
                        </span>
                    </div>
                    <div class="feature-row">
                        <span class="feature-icon" aria-hidden="true">
                            <svg class="icon" viewBox="0 0 24 24"><path d="M12 22a9 9 0 1 0-9-9 7 7 0 0 0 7 7h1.5a1.5 1.5 0 0 0 0-3H10a2 2 0 0 1 0-4h4a2 2 0 0 1 0 4h-.5a1.5 1.5 0 0 0 0 3H14a8 8 0 0 0 8-8"/></svg>
                        </span>
                        <span>
                            <span class="feature-title">角色、场景保持一致</span>
                            <span class="feature-desc">集中管理素材，减少重复设置和来回切换</span>
                        </span>
                    </div>
                    <div class="feature-row">
                        <span class="feature-icon" aria-hidden="true">
                            <svg class="icon" viewBox="0 0 24 24"><path d="M4 11h16v9a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2z"/><path d="M4 11 3 6l18-4 1 5z"/><path d="m8 5 3 5"/><path d="m15 3 3 5"/></svg>
                        </span>
                        <span>
                            <span class="feature-title">从分镜一路做到成片</span>
                            <span class="feature-desc">画面、视频、配音、字幕和剪辑连成完整流程</span>
                        </span>
                    </div>
                </div>
            </div>

            <div class="brand-footer">© 2026 创剧 · 把一个想法，变成一部好故事</div>
        </section>

        <section class="login-panel">
            <div class="login-card">
                <div class="mobile-brand">
                    <img class="brand-lockup" src="/static/branding/chuangju-logo-on-light.svg?v=20260824-chuangju-v1" alt="创剧" />
                </div>

                <h2>欢迎回来</h2>
                <p class="subtitle">登录后继续完成你的故事</p>

                <form onsubmit="handleLogin(event)">
                    <div class="input-group">
                        <input id="username" type="text" autocomplete="username" placeholder=" " required>
                        <label for="username">账号 / Email</label>
                    </div>

                    <div class="input-group">
                        <input id="password" type="password" autocomplete="current-password" placeholder=" " required>
                        <label for="password">密码</label>
                    </div>

                    <div class="form-row">
                        <label class="remember">
                            <input type="checkbox">
                            <span>记住我</span>
                        </label>
                        <a href="#" class="link">忘记密码?</a>
                    </div>

                    <button id="loginBtn" type="submit" class="login-button">
                        <span>进入创剧</span>
                        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
                    </button>
                </form>

                <div id="errorMessage" class="error hidden"></div>
            </div>
        </section>
    </main>

    <script>
        const TOKEN_KEY = 'auth_token';
        const USERNAME_KEY = 'username';
        const USER_ID_KEY = 'user_id';
        const defaultButtonContent = document.getElementById('loginBtn').innerHTML;

        if (localStorage.getItem(TOKEN_KEY)) {
            window.location.href = '/projects';
        }

        async function login(username, password) {
            const response = await fetch('/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            });

            let payload = null;
            try {
                payload = await response.json();
            } catch (error) {
                payload = null;
            }

            if (!response.ok) {
                const message = payload && (payload.detail || payload.error);
                throw new Error(message || '\u767b\u5f55\u5931\u8d25');
            }

            if (payload && payload.token) {
                localStorage.setItem(TOKEN_KEY, payload.token);
                localStorage.setItem(USERNAME_KEY, payload.username || username);
                localStorage.setItem(USER_ID_KEY, payload.user_id || payload.username || username);
            }

            return payload || {};
        }

        async function handleLogin(event) {
            if (event) event.preventDefault();
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();
            const loginBtn = document.getElementById('loginBtn');
            const errorMsg = document.getElementById('errorMessage');

            if (!username || !password) {
                errorMsg.textContent = '\u8bf7\u8f93\u5165\u7528\u6237\u540d\u548c\u5bc6\u7801';
                errorMsg.classList.remove('hidden');
                return;
            }

            errorMsg.classList.add('hidden');
            loginBtn.disabled = true;
            loginBtn.innerHTML = '<span>\u767b\u5f55\u4e2d...</span><span class="loader" aria-hidden="true"></span>';

            try {
                const result = await login(username, password);
                if (result.success || result.token) {
                    window.location.href = '/projects';
                } else {
                    throw new Error(result.error || '\u767b\u5f55\u5931\u8d25');
                }
            } catch (error) {
                console.error('\u767b\u5f55\u5931\u8d25:', error);
                errorMsg.textContent = error.message || '\u767b\u5f55\u5931\u8d25\uff0c\u8bf7\u68c0\u67e5\u7528\u6237\u540d\u548c\u5bc6\u7801';
                errorMsg.classList.remove('hidden');
                loginBtn.disabled = false;
                loginBtn.innerHTML = defaultButtonContent;
            }
        }
    </script>
</body>
</html>
