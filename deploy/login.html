<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="/favicon.ico?v=20260730-spti-icon-v1" sizes="any" />
    <link rel="icon" href="/favicon-32x32.png?v=20260730-spti-icon-v1" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=20260730-spti-icon-v1" />
    <title>SPTI.AI - 登录</title>
    <style>
        :root {
            --n0: #FFFFFF;
            --n10: #FCFCFC;
            --n20: #F7F7F7;
            --n30: #EEEEEE;
            --n40: #D8D8D8;
            --n100: #ABABAB;
            --n200: #777777;
            --n300: #5A5A5A;
            --n700: #222222;
            --n800: #080808;
            --primary: #146EF5;
            --primary-hover: #0055D4;
            --primary-active: #006ACC;
            --primary-light: #EAF2FF;
            --purple: #7A3DFF;
            --pink: #ED52CB;
            --green: #00D722;
            --danger: #EE1D36;
            --border-hover: #898989;
            --shadow-cascade:
                rgba(0, 0, 0, 0) 0 84px 24px,
                rgba(0, 0, 0, 0.01) 0 54px 22px,
                rgba(0, 0, 0, 0.04) 0 30px 18px,
                rgba(0, 0, 0, 0.08) 0 13px 13px,
                rgba(0, 0, 0, 0.09) 0 3px 7px;
            --font-sans: "WF Visual Sans Variable", Arial, "PingFang SC", "Microsoft YaHei", sans-serif;
        }

        * { box-sizing: border-box; }

        html,
        body {
            margin: 0;
            min-height: 100%;
            overflow-x: hidden;
            font-family: var(--font-sans);
            background: var(--n0);
            color: var(--n800);
            -webkit-font-smoothing: antialiased;
        }

        body {
            min-height: 100vh;
            display: flex;
        }

        .shell {
            min-height: 100vh;
            width: 100%;
            display: flex;
        }

        .brand-panel {
            position: relative;
            display: flex;
            width: 58%;
            min-width: 420px;
            flex-direction: column;
            justify-content: space-between;
            padding: 48px;
            background:
                radial-gradient(circle at 78% 18%, rgba(122, 61, 255, 0.72), transparent 30%),
                radial-gradient(circle at 18% 88%, rgba(237, 82, 203, 0.32), transparent 34%),
                linear-gradient(145deg, #146EF5 0%, #0055D4 52%, #080808 100%);
            color: white;
            overflow: hidden;
        }

        .brand-panel::before {
            content: "";
            position: absolute;
            inset: 0;
            background:
                linear-gradient(rgba(255,255,255,0.1) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,0.1) 1px, transparent 1px);
            background-size: 40px 40px;
            mask-image: linear-gradient(to bottom, rgba(0,0,0,0.7), transparent 88%);
            pointer-events: none;
        }

        .brand-top,
        .brand-content,
        .brand-footer {
            position: relative;
            z-index: 1;
        }

        .brand-top,
        .mobile-brand,
        .feature-row {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo {
            width: 40px;
            height: 40px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            object-fit: contain;
        }

        .mobile-brand .logo {
            width: 36px;
            height: 36px;
        }

        .brand-name {
            font-size: 20px;
            line-height: 1;
            font-weight: 600;
            letter-spacing: -0.2px;
        }

        .brand-dot {
            color: #146EF5;
        }

        .brand-panel .logo {
            filter:
                drop-shadow(2px 0 0 rgba(255,255,255,0.98))
                drop-shadow(-2px 0 0 rgba(255,255,255,0.98))
                drop-shadow(0 2px 0 rgba(255,255,255,0.98))
                drop-shadow(0 -2px 0 rgba(255,255,255,0.98))
                drop-shadow(1.4px 1.4px 0 rgba(255,255,255,0.98))
                drop-shadow(-1.4px 1.4px 0 rgba(255,255,255,0.98))
                drop-shadow(1.4px -1.4px 0 rgba(255,255,255,0.98))
                drop-shadow(-1.4px -1.4px 0 rgba(255,255,255,0.98))
                drop-shadow(0 2px 5px rgba(8,8,8,0.28));
        }

        .brand-content {
            max-width: 420px;
        }

        .brand-content h1 {
            margin: 0 0 12px;
            font-size: clamp(30px, 3.2vw, 42px);
            line-height: 1.08;
            font-weight: 600;
            letter-spacing: -0.4px;
        }

        .brand-content p {
            margin: 0 0 40px;
            color: rgba(255,255,255,0.76);
            font-size: 14px;
            line-height: 1.8;
        }

        .feature-list {
            display: grid;
            gap: 20px;
        }

        .feature-icon {
            width: 36px;
            height: 36px;
            flex: 0 0 auto;
            border: 1px solid rgba(255,255,255,0.22);
            border-radius: 4px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: rgba(255,255,255,0.12);
        }

        .feature-title {
            display: block;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .feature-desc,
        .brand-footer {
            display: block;
            color: rgba(255,255,255,0.62);
            font-size: 12px;
        }

        .login-panel {
            flex: 1;
            min-width: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background: var(--n0);
        }

        .login-card {
            width: 100%;
            max-width: 400px;
        }

        .mobile-brand {
            display: none;
            justify-content: center;
            margin-bottom: 32px;
        }

        h2 {
            margin: 0 0 4px;
            font-size: 32px;
            line-height: 1.3;
            font-weight: 600;
            letter-spacing: -0.32px;
            color: var(--n800);
        }

        .subtitle {
            margin: 0 0 32px;
            color: var(--n300);
            font-size: 16px;
            line-height: 1.6;
        }

        form {
            display: grid;
            gap: 24px;
        }

        .input-group {
            position: relative;
        }

        .input-group input[type="text"],
        .input-group input[type="password"] {
            width: 100%;
            height: 48px;
            border: 1px solid var(--n40);
            border-radius: 4px;
            background: var(--n0);
            color: var(--n800);
            font: inherit;
            font-size: 16px;
            outline: none;
            padding: 10px 12px 8px;
            transition: border-color 150ms ease, box-shadow 150ms ease;
        }

        .input-group input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(20,110,245,0.16);
        }

        .input-group label {
            position: absolute;
            left: 10px;
            top: 15px;
            padding: 0 4px;
            background: var(--n0);
            color: var(--n200);
            font-size: 15px;
            line-height: 1;
            pointer-events: none;
            transition: transform 150ms ease, color 150ms ease;
            transform-origin: left center;
        }

        .input-group input:focus + label,
        .input-group input:not(:placeholder-shown) + label {
            transform: translateY(-22px) scale(0.82);
            color: var(--primary);
        }

        .form-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            color: var(--n300);
            font-size: 12px;
        }

        .remember {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
        }

        .remember:hover,
        .link:hover {
            color: var(--primary);
        }

        .remember input {
            accent-color: var(--primary);
        }

        .link {
            color: inherit;
            text-decoration: none;
            transition: color 150ms ease;
        }

        .login-button {
            width: 100%;
            height: 48px;
            border: 0;
            border-radius: 4px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background: var(--primary);
            color: white;
            font: inherit;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            box-shadow: var(--shadow-cascade);
            transition: background-color 150ms ease, transform 150ms ease, box-shadow 150ms ease;
        }

        .login-button:hover {
            background: var(--primary-hover);
            transform: translateX(6px);
        }

        .login-button:active {
            transform: translateX(6px) scale(0.99);
            background: var(--primary-active);
        }

        .login-button:disabled {
            cursor: wait;
            opacity: 0.72;
        }

        .icon {
            width: 16px;
            height: 16px;
            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
            fill: none;
        }

        .loader {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            border: 2px solid rgba(255,255,255,0.4);
            border-top-color: white;
            animation: spin 800ms linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .error {
            margin-top: 16px;
            min-height: 18px;
            color: var(--danger);
            text-align: center;
            font-size: 14px;
        }

        .hidden {
            display: none;
        }

        @media (max-width: 992px) {
            .brand-panel {
                display: none;
            }

            .mobile-brand {
                display: flex;
            }

            .login-panel {
                min-height: 100vh;
            }
        }

        @media (max-width: 479px) {
            .login-panel {
                align-items: flex-start;
                padding: 72px 20px 32px;
            }

            .mobile-brand {
                justify-content: flex-start;
                margin-bottom: 48px;
            }

            h2 {
                font-size: 28px;
            }

            form {
                gap: 20px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                animation-duration: 0.01ms !important;
                transition-duration: 0.01ms !important;
            }

            .login-button:hover,
            .login-button:active {
                transform: none;
            }
        }
    </style>
</head>
<body>
    <main class="shell">
        <section class="brand-panel" aria-label="SPTI.AI 漫剧创作平台">
            <div class="brand-top">
                <img class="logo" src="/static/branding/spti-ai-mark.png" alt="" />
                <div class="brand-name">SPTI.AI</div>
            </div>

            <div class="brand-content">
                <h1>AI 漫剧创作平台</h1>
                <p>Story Production Technology Intelligence，意为“故事生产技术智能”，基于 AI 能力打造漫剧生产智能平台。</p>
                <div class="feature-list">
                    <div class="feature-row">
                        <span class="feature-icon" aria-hidden="true">
                            <svg class="icon" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M8 13h8"/><path d="M8 17h6"/></svg>
                        </span>
                        <span>
                            <span class="feature-title">智能剧本与分镜</span>
                            <span class="feature-desc">小说一键转剧本，自动拆镜头</span>
                        </span>
                    </div>
                    <div class="feature-row">
                        <span class="feature-icon" aria-hidden="true">
                            <svg class="icon" viewBox="0 0 24 24"><path d="M12 22a9 9 0 1 0-9-9 7 7 0 0 0 7 7h1.5a1.5 1.5 0 0 0 0-3H10a2 2 0 0 1 0-4h4a2 2 0 0 1 0 4h-.5a1.5 1.5 0 0 0 0 3H14a8 8 0 0 0 8-8"/></svg>
                        </span>
                        <span>
                            <span class="feature-title">多模型生成引擎</span>
                            <span class="feature-desc">文本 / 图像 / 视频 / 配音全覆盖</span>
                        </span>
                    </div>
                    <div class="feature-row">
                        <span class="feature-icon" aria-hidden="true">
                            <svg class="icon" viewBox="0 0 24 24"><path d="M4 11h16v9a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2z"/><path d="M4 11 3 6l18-4 1 5z"/><path d="m8 5 3 5"/><path d="m15 3 3 5"/></svg>
                        </span>
                        <span>
                            <span class="feature-title">一键合成成片</span>
                            <span class="feature-desc">分镜到视频、配音自动对齐导出</span>
                        </span>
                    </div>
                </div>
            </div>

            <div class="brand-footer">© 2026 SPTI.AI · Story Production Technology Intelligence</div>
        </section>

        <section class="login-panel">
            <div class="login-card">
                <div class="mobile-brand">
                    <img class="logo" src="/static/branding/spti-ai-mark.png" alt="" />
                    <div class="brand-name">SPTI.AI</div>
                </div>

                <h2>欢迎回来</h2>
                <p class="subtitle">登录以继续你的创作</p>

                <form onsubmit="handleLogin(event)">
                    <div class="input-group">
                        <input id="username" type="text" autocomplete="username" placeholder=" " required>
                        <label for="username">账号 / Email</label>
                    </div>

                    <div class="input-group">
                        <input id="password" type="password" autocomplete="current-password" placeholder=" " required>
                        <label for="password">密码</label>
                    </div>

                    <div class="form-row">
                        <label class="remember">
                            <input type="checkbox">
                            <span>记住我</span>
                        </label>
                        <a href="#" class="link">忘记密码?</a>
                    </div>

                    <button id="loginBtn" type="submit" class="login-button">
                        <span>进入系统</span>
                        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
                    </button>
                </form>

                <div id="errorMessage" class="error hidden"></div>
            </div>
        </section>
    </main>

    <script>
        const TOKEN_KEY = 'auth_token';
        const USERNAME_KEY = 'username';
        const USER_ID_KEY = 'user_id';
        const defaultButtonContent = document.getElementById('loginBtn').innerHTML;

        if (localStorage.getItem(TOKEN_KEY)) {
            window.location.href = '/projects';
        }

        async function login(username, password) {
            const response = await fetch('/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            });

            let payload = null;
            try {
                payload = await response.json();
            } catch (error) {
                payload = null;
            }

            if (!response.ok) {
                const message = payload && (payload.detail || payload.error);
                throw new Error(message || '\u767b\u5f55\u5931\u8d25');
            }

            if (payload && payload.token) {
                localStorage.setItem(TOKEN_KEY, payload.token);
                localStorage.setItem(USERNAME_KEY, payload.username || username);
                localStorage.setItem(USER_ID_KEY, payload.user_id || payload.username || username);
            }

            return payload || {};
        }

        async function handleLogin(event) {
            if (event) event.preventDefault();
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();
            const loginBtn = document.getElementById('loginBtn');
            const errorMsg = document.getElementById('errorMessage');

            if (!username || !password) {
                errorMsg.textContent = '\u8bf7\u8f93\u5165\u7528\u6237\u540d\u548c\u5bc6\u7801';
                errorMsg.classList.remove('hidden');
                return;
            }

            errorMsg.classList.add('hidden');
            loginBtn.disabled = true;
            loginBtn.innerHTML = '<span>\u767b\u5f55\u4e2d...</span><span class="loader" aria-hidden="true"></span>';

            try {
                const result = await login(username, password);
                if (result.success || result.token) {
                    window.location.href = '/projects';
                } else {
                    throw new Error(result.error || '\u767b\u5f55\u5931\u8d25');
                }
            } catch (error) {
                console.error('\u767b\u5f55\u5931\u8d25:', error);
                errorMsg.textContent = error.message || '\u767b\u5f55\u5931\u8d25\uff0c\u8bf7\u68c0\u67e5\u7528\u6237\u540d\u548c\u5bc6\u7801';
                errorMsg.classList.remove('hidden');
                loginBtn.disabled = false;
                loginBtn.innerHTML = defaultButtonContent;
            }
        }
    </script>
</body>
</html>
