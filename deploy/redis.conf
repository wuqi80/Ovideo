# Redis 持久化配置
# 用于保存 ComfyUI 集群的任务历史记录

# 绑定地址
bind 127.0.0.1

# 端口
port 6379

# RDB 持久化（快照）
# 900秒内至少1个key变化，保存快照
save 900 1
# 300秒内至少10个key变化，保存快照
save 300 10
# 60秒内至少10000个key变化，保存快照
save 60 10000

# RDB 文件名
dbfilename dump.rdb

# 数据目录
dir ./redis_data

# 启用压缩
rdbcompression yes

# RDB 文件校验
rdbchecksum yes

# AOF 持久化（追加文件）
appendonly yes
appendfilename "appendonly.aof"

# AOF 同步策略
# always: 每次写入都同步（最安全但最慢）
# everysec: 每秒同步一次（默认，平衡性能和安全）
# no: 由操作系统决定（最快但可能丢失数据）
appendfsync everysec

# AOF 重写配置
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# 日志级别
loglevel notice

# 日志文件
logfile "redis.log"

# 最大内存（根据实际情况调整）
# maxmemory 2gb

# 内存淘汰策略（当达到最大内存时）
# allkeys-lru: 删除最少使用的key
maxmemory-policy allkeys-lru

# 数据库数量
databases 16

# 禁用保护模式（仅本地访问）
protected-mode yes

# 后台运行
daemonize no

# 超时时间（0表示永不超时）
timeout 0

# TCP keepalive
tcp-keepalive 300

# 慢查询日志
slowlog-log-slower-than 10000
slowlog-max-len 128
